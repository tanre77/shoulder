name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  ios:
    name: iOS (optional)
    runs-on: macos-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Build Towy without code signing
        working-directory: ios
        run: |
          xcodebuild \
            -project Towy.xcodeproj \
            -scheme Towy \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
